name: expense_tracker
description: A Flutter expense tracker app based on Monthly Expense Plan Excel sheet
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State management
  provider: ^6.1.1
  # Database
  sqflite: ^2.3.2
  path: ^1.9.0
  # Charts
  fl_chart: ^0.68.0
  # PDF generation
  pdf: ^3.10.7
  printing: ^5.12.0
  # Excel export
  excel: ^4.0.3
  # File handling
  path_provider: ^2.1.2
  open_filex: ^4.5.0
  # Camera for receipt scanning
  camera: ^0.10.5+9
  # Image picker
  image_picker: ^1.0.7
  # OCR (using ML Kit)
  google_mlkit_text_recognition: ^0.11.0
  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  # Firebase (cloud sync)
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.5
  firebase_auth: ^4.17.4
  # Date formatting
  intl: ^0.19.0
  # Shared preferences
  shared_preferences: ^2.2.2
  # Permissions
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true